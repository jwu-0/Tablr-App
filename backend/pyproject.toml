[project]
name = "tablr-backend"
version = "0.1.0"
description = "Tablr API — all business logic lives here."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
# PEP 8: 79 columns for code, 72 for docstrings and comments.
line-length = 79
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors      -- PEP 8 layout
    "W",      # pycodestyle warnings    -- PEP 8 whitespace
    "F",      # pyflakes                -- real bugs
    "I",      # isort                   -- PEP 8 import order
    "N",      # pep8-naming             -- PEP 8 naming conventions
    "D",      # pydocstyle              -- PEP 257 docstrings
    "UP",     # pyupgrade
    "B",      # bugbear
    "ASYNC",  # async correctness
]
ignore = [
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D213",  # conflicts with D212 (summary on the first line)
]

[tool.ruff.lint.pycodestyle]
# PEP 8 wraps prose harder than code.
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Package markers and tests do not need module/function docstrings.
"__init__.py" = ["D104"]
"tests/*" = ["D100", "D103"]
"*_test.py" = ["D100", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
python_files = ["test_*.py", "*_test.py", "*.test.py"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

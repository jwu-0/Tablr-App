packages:
  - 'apps/*'
  - 'packages/*'

# React Native's Metro bundler cannot resolve pnpm's symlinked store layout.
# Keep node_modules hoisted (flat) like npm/yarn so Metro + Expo autolinking work.
nodeLinker: hoisted

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  '@parcel/watcher': true
  msw: true
  unrs-resolver: true

# Versions pnpm's minimum-release-age gate would otherwise hold back.
minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.117.0'
  - '@supabase/functions-js@2.117.0'
  - '@supabase/postgrest-js@2.117.0'
  - '@supabase/realtime-js@2.117.0'
  - '@supabase/storage-js@2.117.0'
  - '@supabase/supabase-js@2.117.0'

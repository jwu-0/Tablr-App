name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: apps/mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @tablr/mobile lint

      - name: Typecheck
        run: pnpm --filter @tablr/mobile typecheck

      - name: Test
        run: pnpm --filter @tablr/mobile test

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy app

      - name: Test
        run: pytest -q

  contract:
    name: contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pnpm install --frozen-lockfile
      - run: pip install -e ".[dev]"
        working-directory: backend

      # Regenerate the contract and the client; a diff means someone changed a
      # router or a schema without running `pnpm codegen`.
      - run: pnpm codegen

      - name: Fail if the generated files are stale
        run: |
          if ! git diff --quiet; then
            echo "::error::openapi.json or the generated client is out of date. Run 'pnpm codegen' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
